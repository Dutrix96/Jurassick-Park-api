services:
  db:
    image: mysql:8.4
    container_name: jurassic_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jurassic_net
  adminer:
    image: adminer:4
    container_name: jurassic_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - jurassic_net

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: jurassic_back
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./back:/var/www
    depends_on:
      - db
    networks:
      - jurassic_net

  nginx:
    image: nginx:alpine
    container_name: jurassic_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./back:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - back
    networks:
      - jurassic_net

  front:
    image: node:20-alpine
    container_name: jurassic_front
    working_dir: /app
    volumes:
      - ./front:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    networks:
      - jurassic_net

volumes:
  db_data:

networks:
  jurassic_net:
    driver: bridge